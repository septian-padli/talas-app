events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # Log format agar mudah debugging
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;
    
    # Increase Upload Size Limit
    client_max_body_size 10M;

    # ----------------------------------------------------
    # UPSTREAM DEFINITIONS
    # (Mengarah ke Laptop Host via host.docker.internal)
    # ----------------------------------------------------
    upstream user_service {
        # Arahkan ke container 'user_service' di port 3001
        # server user_service:3001;
        
        # Arahkan ke Node App di port 3001 (Local Node Run)
        server host.docker.internal:3001;
    }

    upstream content_service {
        # Arahkan ke container 'content_service' di port 3002
        # server content_service:3002;
        
        # Arahkan ke Go App di port 3002 (Local Go Run)
        server host.docker.internal:3002;
    }

    server {
        listen 80;
        server_name localhost;

        # Header standar untuk proxy
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # ----------------------------------------------------
        # ROUTING RULES (Sesuai Diagram)
        # ----------------------------------------------------

        # 1. GROUP USER SERVICE (Express)
        # Menangani: Auth, Users Profile, Follows, Notifications
        location ~ ^/api/(auth|users|notifications) {
            add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
            expires off;
            proxy_pass http://user_service;
        }

        # 2. GROUP CONTENT SERVICE (Go)
        # Menangani: Showcases, Comments, Feed, Search, Collaborations, Test
        location ~ ^/api/(showcases|comments|feed|search|collaborations|test|categories) {
            add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
            expires off;
            proxy_pass http://content_service;
        }

        # 3. INTERNAL API PROTECTION (Security)
        # Blokir akses publik ke endpoint /internal
        location /api/internal {
            deny all;
            return 403;
        }

        # 4. Error handlers (JSON format)
        error_page 404 /404.json;
        location /404.json {
            return 404 '{"status": "error", "message": "Endpoint not found"}';
        }

        error_page 413 /413.json;
        location /413.json {
            return 413 '{"code":413,"success":false,"message":"Payload Too Large"}';
        }
    }
}